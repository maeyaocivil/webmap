<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>WebMap แม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body, #map { height: 100%; margin: 0; }
  .layer-control {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(255,255,255,0.95);
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    max-height: 90vh;
    overflow-y: auto;
    width: 300px;
  }
  .slider { width: 100%; }
  .group-title { font-weight: bold; margin-top: 10px; color: #006400; }
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.4/leaflet-omnivore.min.js"></script>
</head>
<body>
<div id="map"></div>

<div class="layer-control" id="layerControl">
  <h3 style="margin:5px 0;">🗺️ แผนที่ฐาน</h3>
  <label><input type="radio" name="basemap" value="osm" checked> OpenStreetMap</label><br>
  <label><input type="radio" name="basemap" value="satellite"> Google Satellite</label>
  <hr>
  <h3 style="margin:5px 0;">📍 ชั้นข้อมูล</h3>
  <div id="layers"></div>
</div>

<script>
const map = L.map('map').setView([19.95, 99.85], 12);

// แผนที่ฐาน
const baseLayers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20, attribution: '&copy; OpenStreetMap'
  }),
  satellite: L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3']
  })
};
baseLayers.osm.addTo(map);

// สลับแผนที่ฐาน
document.querySelectorAll('input[name="basemap"]').forEach(r=>{
  r.addEventListener('change', e=>{
    map.eachLayer(l=>{ if(l instanceof L.TileLayer) map.removeLayer(l); });
    baseLayers[e.target.value].addTo(map);
  });
});

// โหลดข้อมูลจาก layers.json
fetch("layers.json")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("layers");

    data.groups.forEach((group, gIdx) => {
      const groupDiv = document.createElement("div");
      groupDiv.innerHTML = `<div class='group-title'>${group.name}</div>`;
      container.appendChild(groupDiv);

      group.layers.forEach((layerInfo, idx) => {
        const id = `${gIdx}-${idx}`;
        const color = layerInfo.color || getRandomColor();

        const div = document.createElement("div");
        div.innerHTML = `
          <label><input type="checkbox" id="layer-${id}"> ${layerInfo.name}</label><br>
          ความทึบแสง: <input type="range" min="0" max="100" value="100" class="slider" id="opacity-${id}">
          <br>ความหนาเส้น: <input type="range" min="0" max="10" value="2" class="slider" id="weight-${id}">
          <hr>`;
        groupDiv.appendChild(div);

        let layerGroup = L.layerGroup();

        document.getElementById(`layer-${id}`).addEventListener("change", e=>{
          if(e.target.checked){
            if(layerInfo.name.includes("แนวเขตหมู่บ้าน")){
              omnivore.kml(layerInfo.file).on('ready', function(){
                this.eachLayer(f=>{
                  const c = getRandomColor();
                  f.setStyle({
                    color: "#333333",   // ขอบเข้มคงที่
                    weight: getWeight(id),
                    fillColor: c,
                    fillOpacity: getOpacity(id)
                  });
                });
              }).addTo(layerGroup);
            } else {
              omnivore.kml(layerInfo.file).on('ready', function(){
                this.setStyle({
                  color: "#222222",     // ขอบเข้มคงที่
                  weight: getWeight(id),
                  fillColor: color,
                  fillOpacity: getOpacity(id)
                });
              }).addTo(layerGroup);
            }
            layerGroup.addTo(map);
          } else {
            map.removeLayer(layerGroup);
          }
        });

        document.getElementById(`opacity-${id}`).addEventListener("input", ()=>{
          layerGroup.eachLayer(f=>{
            f.setStyle({ fillOpacity: getOpacity(id), color: f.options.color });
          });
        });

        document.getElementById(`weight-${id}`).addEventListener("input", ()=>{
          layerGroup.eachLayer(f=>{ f.setStyle({ weight: getWeight(id) }); });
        });
      });
    });
  });

// ฟังก์ชันช่วย
function getOpacity(id){ return parseInt(document.getElementById(`opacity-${id}`).value)/100; }
function getWeight(id){ return parseInt(document.getElementById(`weight-${id}`).value); }
function getRandomColor(){ return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'); }
</script>
</body>
</html>
