<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// 🗺️ แผนที่ฐาน
const baseLayers = {
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  "Google Maps": L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 })
};
baseLayers["OpenStreetMap"].addTo(map);

// ✅ ปุ่มเลือกแผนที่ฐาน
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach((key, index) => {
  const btn = document.createElement('div');
  btn.textContent = key;
  btn.className = 'basemap-btn' + (index === 0 ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// ✅ ปุ่มเปิด/ปิดแผงควบคุม
const toggleBtn = document.getElementById('toggleBtn');
const layerControl = document.getElementById('layerControl');
toggleBtn.onclick = () => {
  layerControl.style.display = layerControl.style.display === 'none' ? 'block' : 'none';
};

// โหลดข้อมูลจาก layers.json
fetch('layers.json')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('layerList');
    data.groups.forEach(group => {
      const title = document.createElement('div');
      title.className = 'layer-group-title';
      title.textContent = group.name;
      list.appendChild(title);

      group.layers.forEach(layerInfo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'layer-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = layerInfo.name;
        const label = document.createElement('label');
        label.htmlFor = layerInfo.name;
        label.textContent = " " + layerInfo.name;
        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(label);
        list.appendChild(itemDiv);

        let layer;
        let baseColor = layerInfo.color || getRandomColor();

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            layer = omnivore.kml(layerInfo.file).on('ready', function() {
              // ✅ ถ้าเป็นแนวเขตหมู่บ้าน → แต่ละ polygon สีสุ่มไม่ซ้ำ
              if (layerInfo.name.includes("แนวเขตหมู่บ้าน")) {
                layer.eachLayer(l => {
                  if (l.setStyle)
                    l.setStyle({
                      color: "#000000",           // เส้นขอบเข้มตลอด
                      weight: 2,
                      opacity: 1,                 // ขอบเส้นคงที่
                      fillColor: getRandomColor(), // สีแต่ละ polygon ไม่ซ้ำ
                      fillOpacity: 0.5
                    });
                });
              } else {
                // ✅ ชั้นทั่วไป ใช้สีเดียวทั้งชั้น
                layer.eachLayer(l => {
                  if (l.setStyle)
                    l.setStyle({
                      color: "#000000",    // เส้นขอบเข้มตลอด
                      weight: 2,
                      opacity: 1,          // ขอบเส้นคงที่
                      fillColor: baseColor,
                      fillOpacity: 0.5
                    });
                });
              }
            }).addTo(map);

            // ✅ สไลด์ปรับความทึบของ Fill
            const opacityDiv = document.createElement('div');
            opacityDiv.className = 'slider-container';
            opacityDiv.innerHTML = `ความทึบแสง: <input type="range" min="0" max="100" value="50">`;
            const opacitySlider = opacityDiv.querySelector('input');
            opacitySlider.addEventListener('input', () => {
              const fillValue = opacitySlider.value / 100;
              layer.eachLayer(l => {
                if (l.setStyle) l.setStyle({ fillOpacity: fillValue });
              });
            });
            itemDiv.appendChild(opacityDiv);

            // ✅ สไลด์ปรับความหนาเส้น
            const weightDiv = document.createElement('div');
            weightDiv.className = 'slider-container';
            weightDiv.innerHTML = `ความหนาเส้น: <input type="range" min="0" max="10" value="2">`;
            const weightSlider = weightDiv.querySelector('input');
            weightSlider.addEventListener('input', () => {
              const value = parseFloat(weightSlider.value);
              layer.eachLayer(l => {
                if (l.setStyle) l.setStyle({ weight: value });
              });
            });
            itemDiv.appendChild(weightDiv);

          } else {
            if (layer) map.removeLayer(layer);
            itemDiv.querySelectorAll('.slider-container').forEach(el => el.remove());
          }
        });
      });
    });
  })
  .catch(err => console.error("Error loading layers.json:", err));

// ฟังก์ชันสุ่มสี
function getRandomColor() {
  return '#' + Math.floor(Math.random() * 16777215).toString(16);
}
</script>
