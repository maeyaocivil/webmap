<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>WebMap Chiang Rai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .layer-slider {
      margin: 4px 0 8px 10px;
      width: 160px;
    }
    .leaflet-control-layers {
      font-family: "TH Sarabun New", sans-serif;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
  <script src="https://unpkg.com/omnivore/leaflet-omnivore.min.js"></script>

  <script>
    const map = L.map('map').setView([19.9, 99.8], 11);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: ['mt0','mt1','mt2','mt3'],
      attribution: '&copy; Google'
    });

    const baseMaps = {
      "OSM": osm,
      "Google ดาวเทียม": googleSat
    };

    const overlayMaps = {};
    const activeLayers = {}; // เก็บชั้นข้อมูลที่เปิดอยู่

    // โหลดจาก layers.json
    fetch('layers.json')
      .then(res => res.json())
      .then(layers => {
        layers.forEach(layer => {
          const kmlLayer = omnivore.kml(layer.file, null, L.geoJSON(null, {
            style: { color: layer.color, weight: layer.weight || 2, fillOpacity: 0 },
          }));

          overlayMaps[layer.name] = kmlLayer;

          // เมื่อเพิ่มหรือลบเลเยอร์
          kmlLayer.on('add', () => addOpacitySlider(layer.name, kmlLayer));
          kmlLayer.on('remove', () => removeOpacitySlider(layer.name));
        });

        const layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
      });

    // ฟังก์ชันเพิ่ม slider
    function addOpacitySlider(layerName, layer) {
      if (document.getElementById('slider-' + layerName)) return;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = 0;
      slider.max = 100;
      slider.value = 100;
      slider.className = 'layer-slider';
      slider.id = 'slider-' + layerName;

      const label = Array.from(document.querySelectorAll('.leaflet-control-layers-overlays label'))
        .find(l => l.textContent.trim() === layerName);

      if (label) label.appendChild(slider);

      slider.addEventListener('input', e => {
        const opacity = e.target.value / 100;
        layer.eachLayer(l => {
          if (l.setStyle) l.setStyle({ opacity: opacity });
        });
      });
    }

    // ฟังก์ชันลบ slider
    function removeOpacitySlider(layerName) {
      const el = document.getElementById('slider-' + layerName);
      if (el) el.remove();
    }

    // ปุ่มหาตำแหน่งผู้ใช้
    L.control.locate({
      position: 'topleft',
      strings: { title: "หาตำแหน่งของฉัน" },
      flyTo: true
    }).addTo(map);
  </script>
</body>
</html>
