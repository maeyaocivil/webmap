<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>WebMap - เทศบาลตำบลแม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; width: 100%; }

  #toggleBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    border: 1px solid #999;
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 1001;
    cursor: pointer;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-family: "Sarabun", sans-serif;
  }

  .layer-control {
    position: absolute;
    top: 50px;
    right: 10px;
    background: white;
    padding: 10px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    width: 300px;
    font-family: "Sarabun", sans-serif;
    z-index: 1000;
    display: none;
  }

  .layer-group-title {
    font-weight: bold;
    background: #e0e0e0;
    padding: 6px;
    margin: 5px 0;
    border-radius: 5px;
  }

  .layer-item {
    margin-left: 10px;
    margin-bottom: 8px;
  }

  .slider-container {
    margin: 2px 0 4px 20px;
    font-size: 0.85em;
    color: #333;
  }

  .slider-container input[type="range"] {
    width: 85%;
  }

  .basemap-btn {
    display: inline-block;
    background: #f2f2f2;
    border: 1px solid #ccc;
    padding: 4px 8px;
    margin: 2px;
    border-radius: 5px;
    cursor: pointer;
  }

  .basemap-btn.active {
    background: #d1e7ff;
    border-color: #007bff;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="toggleBtn">🧭 ชั้นข้อมูล</div>

<div class="layer-control" id="layerControl">
  <h3>🗺️ แผนที่ฐาน</h3>
  <div id="basemaps"></div>
  <h3>📚 ชั้นข้อมูล</h3>
  <div id="layerList"></div>
</div>

<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// 🗺️ Base Layers
const baseLayers = {
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 })
};

// Default
baseLayers["OpenStreetMap"].addTo(map);

// Render basemap buttons
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach(key => {
  const btn = document.createElement('div');
  btn.textContent = key;
  btn.className = 'basemap-btn' + (key === "OpenStreetMap" ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// Toggle control
document.getElementById('toggleBtn').onclick = () => {
  const ctrl = document.getElementById('layerControl');
  ctrl.style.display = ctrl.style.display === 'none' ? 'block' : 'none';
};

// Load KML layers
fetch('layers.json')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('layerList');

    data.groups.forEach(group => {
      const title = document.createElement('div');
      title.className = 'layer-group-title';
      title.textContent = group.name;
      list.appendChild(title);

      group.layers.forEach(layerInfo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'layer-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = layerInfo.name;

        const label = document.createElement('label');
        label.htmlFor = layerInfo.name;
        label.textContent = " " + layerInfo.name;

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(label);
        list.appendChild(itemDiv);

        let layer;
        const fillOpacity = 0.5;
        const weight = 2;
        const radius = 8;
        const singleLayerColor = getRandomColor();

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            const isVillage = (layerInfo.name === "แนวเขตหมู่บ้าน");
            layer = omnivore.kml(layerInfo.file).on('ready', function() {
              this.eachLayer(l => {
                // ตรวจว่าข้อมูลเป็นจุดหรือไม่
                if (l.feature && l.feature.geometry && l.feature.geometry.type === "Point") {
                  const color = isVillage ? getRandomColor() : singleLayerColor;
                  const marker = L.circleMarker(l.getLatLng(), {
                    radius: radius,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.9,
                    weight: 1
                  });
                  marker.addTo(map);
                  l.remove();
                } else {
                  const color = isVillage ? getRandomColor() : singleLayerColor;
                  l.setStyle({
                    color: "#000000",
                    weight: weight,
                    fillColor: color,
                    fillOpacity: fillOpacity
                  });
                }
              });
            }).addTo(map);

            // --- สร้าง slider ตามประเภท ---
            const sampleFeature = layerInfo.name.includes("แนวเขตหมู่บ้าน") ? "polygon" : "auto";
            if (sampleFeature === "auto" || sampleFeature === "polygon" || sampleFeature === "line") {
              const opacityDiv = document.createElement('div');
              opacityDiv.className = 'slider-container';
              opacityDiv.innerHTML = `ความทึบแสง: <input type="range" min="0" max="100" value="${fillOpacity*100}">`;
              const opacitySlider = opacityDiv.querySelector('input');
              opacitySlider.addEventListener('input', () => {
                const v = opacitySlider.value / 100;
                layer.eachLayer(f => { if (f.setStyle) f.setStyle({ fillOpacity: v }); });
              });
              itemDiv.appendChild(opacityDiv);

              const weightDiv = document.createElement('div');
              weightDiv.className = 'slider-container';
              weightDiv.innerHTML = `ความหนาเส้น: <input type="range" min="0" max="10" value="${weight}">`;
              const weightSlider = weightDiv.querySelector('input');
              weightSlider.addEventListener('input', () => {
                const v = parseFloat(weightSlider.value);
                layer.eachLayer(f => { if (f.setStyle) f.setStyle({ weight: v }); });
              });
              itemDiv.appendChild(weightDiv);
            }

            if (layerInfo.name.includes("ข้อมูล") || layerInfo.name.includes("สถานที่") || layerInfo.name.includes("กิจการ")) {
              const radiusDiv = document.createElement('div');
              radiusDiv.className = 'slider-container';
              radiusDiv.innerHTML = `ขนาดจุด: <input type="range" min="2" max="20" value="${radius}">`;
              const radiusSlider = radiusDiv.querySelector('input');
              radiusSlider.addEventListener('input', () => {
                const v = parseFloat(radiusSlider.value);
                layer.eachLayer(f => { if (f.setRadius) f.setRadius(v); });
              });
              itemDiv.appendChild(radiusDiv);
            }

          } else {
            if (layer) map.removeLayer(layer);
            itemDiv.querySelectorAll('.slider-container').forEach(el => el.remove());
          }
        });
      });
    });
  })
  .catch(err => console.error("Error loading layers.json:", err));

function getRandomColor() {
  return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
}
</script>
</body>
</html>
