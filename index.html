<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>OneMap - เทศบาลตำบลแม่ยาว</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- omnivore สำหรับอ่าน KML -->
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }

    .leaflet-control-layers {
      font-size: 14px;
      background-color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // เริ่มต้นแผนที่
    const map = L.map('map').setView([19.95, 99.8], 12);

    // พื้นหลัง
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ฟังก์ชันสุ่มสี
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 70%, 50%)`;
    }

    // โหลดไฟล์ KML ทั้งหมดจากโฟลเดอร์ layers/
    fetch('https://api.github.com/repos/maeyaocivil/maeyaocivil.github.io/contents/layers')
      .then(res => res.json())
      .then(files => {
        const overlays = {};

        files.forEach(file => {
          if (file.name.endsWith('.kml')) {
            const color = randomColor();
            const layer = omnivore.kml(`layers/${file.name}`, null, L.geoJson(null, {
              style: () => ({
                color: color,
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.2
              })
            })).on('ready', function() {
              map.fitBounds(layer.getBounds());
            });

            overlays[file.name.replace('.kml', '')] = layer;
          }
        });

        L.control.layers(null, overlays, { collapsed: false }).addTo(map);
      })
      .catch(err => console.error('โหลดรายชื่อไฟล์ KML ไม่ได้:', err));
  </script>
</body>
</html>
