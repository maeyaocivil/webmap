<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>WebMap - เทศบาลตำบลแม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; width: 100%; }
  #toggleBtn {
    position: absolute; top: 10px; right: 10px;
    background: white; border: 1px solid #999;
    padding: 6px 12px; border-radius: 6px;
    z-index: 1001; cursor: pointer;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    font-family: "Sarabun", sans-serif;
  }
  .layer-control {
    position: absolute; top: 50px; right: 10px;
    background: white; padding: 10px; max-height: 85vh;
    overflow-y: auto; border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    width: 300px; font-family: "Sarabun", sans-serif;
    z-index: 1000; display: none;
  }
  .layer-group-title {
    font-weight: bold; background: #e0e0e0;
    padding: 6px; margin: 5px 0; border-radius: 5px;
  }
  .layer-item { margin-left: 10px; margin-bottom: 8px; }
  .slider-container { margin: 2px 0 4px 20px; font-size: 0.85em; color: #333; }
  .slider-container input[type="range"] { width: 85%; }
  .basemap-btn {
    display: inline-block; background: #f2f2f2;
    border: 1px solid #ccc; padding: 4px 8px; margin: 2px;
    border-radius: 5px; cursor: pointer;
  }
  .basemap-btn.active { background: #d1e7ff; border-color: #007bff; }
</style>
</head>
<body>
<div id="map"></div>
<div id="toggleBtn">🧭 ชั้นข้อมูล</div>

<div class="layer-control" id="layerControl">
  <h3>🗺️ แผนที่ฐาน</h3>
  <div id="basemaps"></div>
  <h3>📚 ชั้นข้อมูล</h3>
  <div id="layerList"></div>
</div>

<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// 🌍 Base layers
const baseLayers = {
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 })
};

// Default basemap
const defaultLayerKey = "OpenStreetMap";
baseLayers[defaultLayerKey].addTo(map);

// Create basemap buttons
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach(key => {
  const btn = document.createElement('div');
  btn.textContent = key;
  btn.className = 'basemap-btn' + (key === defaultLayerKey ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// Toggle control panel
const toggleBtn = document.getElementById('toggleBtn');
const layerControl = document.getElementById('layerControl');
toggleBtn.onclick = () => {
  layerControl.style.display = layerControl.style.display === 'none' ? 'block' : 'none';
};

// 🎨 Random color generator
function getRandomColor() {
  return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
}

// 🧩 Load layer info
fetch('layers.json')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('layerList');

    data.groups.forEach(group => {
      const title = document.createElement('div');
      title.className = 'layer-group-title';
      title.textContent = group.name;
      list.appendChild(title);

      group.layers.forEach(layerInfo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'layer-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = layerInfo.name;

        const label = document.createElement('label');
        label.htmlFor = layerInfo.name;
        label.textContent = " " + layerInfo.name;

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(label);
        list.appendChild(itemDiv);

        let layer;
        const initialFillOpacity = 0.5;
        const initialWeight = 2;
        const initialRadius = 8;

        // ✅ Handle checkbox change
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            const isVillageBoundary = layerInfo.name.includes("แนวเขตหมู่บ้าน");
            const singleColor = isVillageBoundary ? null : getRandomColor();

            // ✅ Load KML
            layer = omnivore.kml(layerInfo.file).on('ready', function() {
              // Determine geometry types
              const hasPoints = this.toGeoJSON().features.some(f => f.geometry.type === 'Poin
