<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// 🗺️ แผนที่ฐาน (เพิ่ม Google Satellite และ Hybrid)
const baseLayers = {
  "Google Hybrid": L.tileLayer('https://mt1.google.com/vt/lyrs=h&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 }), // ดาวเทียม + ถนน/ชื่อ (แนะนำ)
  "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 }), // ดาวเทียมล้วน
  "Google Maps": L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }), // ถนน
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }) // OSM
};

// ⭐️ ตั้งค่าแผนที่เริ่มต้นเป็น Google Hybrid
const defaultLayerKey = "Google Hybrid";
baseLayers[defaultLayerKey].addTo(map);

// แสดงปุ่มเลือกแผนที่ฐาน
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach(key => {
  const btn = document.createElement('div');
  btn.textContent = key;
  // ทำให้ปุ่มของแผนที่เริ่มต้น active
  btn.className = 'basemap-btn' + (key === defaultLayerKey ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// ✅ ปุ่มเปิด/ปิดแผงควบคุม
const toggleBtn = document.getElementById('toggleBtn');
const layerControl = document.getElementById('layerControl');
toggleBtn.onclick = () => {
  layerControl.style.display = layerControl.style.display === 'none' ? 'block' : 'none';
};

// โหลดข้อมูลจาก layers.json
fetch('layers.json')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('layerList');
    data.groups.forEach(group => {
      const title = document.createElement('div');
      title.className = 'layer-group-title';
      title.textContent = group.name;
      list.appendChild(title);

      group.layers.forEach(layerInfo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'layer-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = layerInfo.name;
        const label = document.createElement('label');
        label.htmlFor = layerInfo.name;
        label.textContent = " " + layerInfo.name;
        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(label);
        list.appendChild(itemDiv);

        let layer;

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            layer = omnivore.kml(layerInfo.file).on('ready', function() {
              layer.eachLayer(l => {
                if (l.setStyle)
                  l.setStyle({
                    color: layerInfo.color || getRandomColor(),
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.3
                  });
              });
            }).addTo(map);

            // Slider ความทึบ
            const opacityDiv = document.createElement('div');
            opacityDiv.className = 'slider-container';
            opacityDiv.innerHTML = `ความทึบแสง: <input type="range" min="0" max="100" value="100">`;
            const opacitySlider = opacityDiv.querySelector('input');
            opacitySlider.addEventListener('input', () => {
              const value = opacitySlider.value / 100;
              layer.eachLayer(l => { if (l.setStyle) l.setStyle({ opacity: value, fillOpacity: value * 0.3 }); }); // ปรับ fillOpacity ให้สัมพันธ์กัน
            });
            itemDiv.appendChild(opacityDiv);

            // Slider ความหนาเส้น
            const weightDiv = document.createElement('div');
            weightDiv.className = 'slider-container';
            weightDiv.innerHTML = `ความหนาเส้น: <input type="range" min="0" max="10" value="2">`;
            const weightSlider = weightDiv.querySelector('input');
            weightSlider.addEventListener('input', () => {
              const value = parseFloat(weightSlider.value);
              layer.eachLayer(l => { if (l.setStyle) l.setStyle({ weight: value }); });
            });
            itemDiv.appendChild(weightDiv);

          } else {
            if (layer) map.removeLayer(layer);
            itemDiv.querySelectorAll('.slider-container').forEach(el => el.remove());
          }
        });
      });
    });
  })
  .catch(err => console.error("Error loading layers.json:", err));

// ฟังก์ชันสุ่มสีให้แต่ละชั้นไม่ซ้ำกัน
function getRandomColor() {
  return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
}
</script>
