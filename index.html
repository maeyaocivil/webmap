<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>OneMap - เทศบาลตำบลแม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
html, body { height: 100%; margin: 0; font-family: "Sarabun", sans-serif; background: #eef3f8; }
#map { height: 100%; width: 100%; }

/* ปุ่ม */
.map-btn {
  position: absolute; left: 15px;
  background: white; padding: 6px 10px;
  border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  border: 1px solid #ccc; cursor: pointer;
  z-index: 1001; font-size: 14px;
}
#resetBtn { top: 15px; }
#locateBtn { top: 60px; }

/* ปุ่มชั้นข้อมูล */
#toggleBtn {
  position: absolute; top: 15px; right: 15px;
  background: white; border: 1px solid #ccc;
  padding: 6px 12px; border-radius: 8px;
  z-index: 1001; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}

/* กล่องควบคุม */
.layer-control {
  position: absolute; top: 60px; right: 15px;
  background: white; padding: 10px;
  max-height: 85vh; overflow-y: auto;
  border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  width: 280px; display: none; z-index: 1000;
}

.layer-item { margin-bottom: 10px; }
.slider-container { margin: 4px 0 4px 20px; font-size: 0.85em; display: none; }
.slider-container input[type="range"] { width: 85%; }

.basemap-btn {
  display: inline-block; background: #f8f9fa;
  border: 1px solid #ccc; padding: 4px 8px; margin: 2px;
  border-radius: 5px; cursor: pointer;
}
.basemap-btn.active { background: #cce5ff; border-color: #007bff; }

.leaflet-control-zoom { margin-top: 110px !important; }
</style>
</head>

<body>
<div id="map"></div>
<div id="resetBtn" class="map-btn">📍 รีเซ็ต ตำบลแม่ยาว</div>
<div id="locateBtn" class="map-btn">📡 ตำแหน่งฉัน</div>
<div id="toggleBtn">🧭 ชั้นข้อมูล</div>

<div class="layer-control" id="layerControl">
  <h3>🗺️ แผนที่ฐาน</h3>
  <div id="basemaps"></div><hr>
  <h3>📚 ชั้นข้อมูล</h3>
  <div id="layerList"></div>
</div>

<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// 🗺️ แผนที่ฐาน
const baseLayers = {
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 })
};
baseLayers["OpenStreetMap"].addTo(map);

// ปุ่มเปลี่ยนแผนที่ฐาน
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach(key => {
  const btn = document.createElement('div');
  btn.textContent = key;
  btn.className = 'basemap-btn' + (key === "OpenStreetMap" ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// ปุ่มเปิด/ปิดชั้นข้อมูล
document.getElementById('toggleBtn').onclick = () => {
  const ctrl = document.getElementById('layerControl');
  ctrl.style.display = ctrl.style.display === 'none' ? 'block' : 'none';
};

// 🎨 สีคงที่ต่อไฟล์
const fixedColors = {};
function getFixedColor(name) {
  if (!fixedColors[name]) {
    const hash = Array.from(name).reduce((acc, c) => acc + c.charCodeAt(0), 0);
    const hue = hash % 360;
    fixedColors[name] = `hsl(${hue},70%,60%)`;
  }
  return fixedColors[name];
}

// 🎨 สีหมู่บ้านคงที่ 20 หมู่
const villageColors = {
  "หมู่ที่ 1": "#ff0000", "หมู่ที่ 2": "#ff6600", "หมู่ที่ 3": "#ffcc00", "หมู่ที่ 4": "#99cc00",
  "หมู่ที่ 5": "#00cc00", "หมู่ที่ 6": "#00cccc", "หมู่ที่ 7": "#0099ff", "หมู่ที่ 8": "#0033cc",
  "หมู่ที่ 9": "#6600cc", "หมู่ที่ 10": "#cc00cc", "หมู่ที่ 11": "#cc0066", "หมู่ที่ 12": "#ff3366",
  "หมู่ที่ 13": "#cc9900", "หมู่ที่ 14": "#669900", "หมู่ที่ 15": "#339966", "หมู่ที่ 16": "#006699",
  "หมู่ที่ 17": "#663399", "หมู่ที่ 18": "#993366", "หมู่ที่ 19": "#999999", "หมู่ที่ 20": "#333333"
};
function colorByVillage(name) {
  for (let k in villageColors) if (name.includes(k)) return villageColors[k];
  return getFixedColor(name);
}

// 📚 โหลดชั้นข้อมูล
fetch('layers/layers.json').then(r => r.json()).then(files => {
  const list = document.getElementById('layerList');
  files.forEach(fileName => {
    const name = fileName.replace('.kml', '');
    const div = document.createElement('div');
    div.className = 'layer-item';
    div.innerHTML = `<input type="checkbox" id="${name}"> <label for="${name}">${name}</label>`;
    list.appendChild(div);

    const sliderDiv = document.createElement('div');
    sliderDiv.className = 'slider-container';
    sliderDiv.innerHTML = `
      <div class="opacity-slider">ความทึบ <input type="range" min="0" max="1" step="0.1" value="0.5"></div>
      <div class="weight-slider">ความหนาเส้น <input type="range" min="1" max="10" step="1" value="2"></div>
      <div class="point-slider">ขนาดจุด <input type="range" min="3" max="20" step="1" value="7"></div>`;
    list.appendChild(sliderDiv);

    const layerGroup = L.layerGroup();
    let geojsonFeatures = [];

    const checkbox = document.getElementById(name);
    const opacitySlider = sliderDiv.querySelector('.opacity-slider input');
    const weightSlider = sliderDiv.querySelector('.weight-slider input');
    const pointSlider = sliderDiv.querySelector('.point-slider input');

    function applyStyle() {
      layerGroup.clearLayers();
      geojsonFeatures.forEach(f => {
        const type = f.geometry.type;
        const color = (fileName.includes("แนวเขตหมู่บ้าน") ? colorByVillage(f.properties.name || '') : getFixedColor(fileName));
        if (type === "Point") {
          const marker = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
            radius: +pointSlider.value,
            fillColor: color,
            color: "#333",
            weight: 1,
            fillOpacity: +opacitySlider.value
          }).bindPopup(f.properties.name || name);
          layerGroup.addLayer(marker);
        } else {
          const layer = L.geoJSON(f, {
            style: {
              color, fillColor: color,
              weight: +weightSlider.value,
              fillOpacity: +opacitySlider.value
            }
          }).bindPopup(f.properties.name || name);
          layerGroup.addLayer(layer);
        }
      });
    }

    function addLayer() {
      omnivore.kml(`layers/${fileName}`).on('ready', function() {
        geojsonFeatures = this.toGeoJSON().features;
        applyStyle();
        layerGroup.addTo(map);
        const hasPoint = geojsonFeatures.some(f => f.geometry.type === 'Point');
        const hasPoly = geojsonFeatures.some(f => f.geometry.type !== 'Point');
        sliderDiv.querySelector('.point-slider').style.display = hasPoint ? 'block' : 'none';
        sliderDiv.querySelector('.opacity-slider').style.display = hasPoly ? 'block' : 'block';
        sliderDiv.querySelector('.weight-slider').style.display = hasPoly ? 'block' : 'none';
        sliderDiv.style.display = 'block';
      });
    }

    checkbox.onchange = e => {
      if (e.target.checked) addLayer();
      else { map.removeLayer(layerGroup); sliderDiv.style.display = 'none'; }
    };
    [opacitySlider, weightSlider, pointSlider].forEach(sl => sl.oninput = applyStyle);
  });
});

// 📍 รีเซ็ต
document.getElementById('resetBtn').onclick = () => map.setView([19.95, 99.80], 12);

// 📡 ตำแหน่งฉัน
let locateActive = false, locateMarker;
const locateBtn = document.getElementById('locateBtn');
locateBtn.onclick = () => {
  locateActive = !locateActive;
  if (locateActive) {
    locateBtn.style.background = '#cce5ff';
    map.locate({ setView: true, maxZoom: 16 });
    map.once('locationfound', e => {
      if (locateMarker) locateMarker.remove();
      locateMarker = L.marker(e.latlng).addTo(map).bindPopup("ตำแหน่งของคุณ").openPopup();
    });
  } else {
    locateBtn.style.background = 'white';
    if (locateMarker) { map.removeLayer(locateMarker); locateMarker = null; }
  }
};
</script>
</body>
</html>
