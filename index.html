<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>OneMap - เทศบาลตำบลแม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.maeyao.go.th/assets/images/logo/180pix_logo-MaeYao.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: "TH Sarabun New", sans-serif; }
  #map { width: 100%; height: 100%; }

  /* โลโก้เทศบาล */
  .logo-container {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    border-radius: 8px;
    padding: 6px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    z-index: 1000;
  }
  .logo-container img {
    width: 50px;
    height: 50px;
    display: block;
    margin: auto;
  }

  /* ปุ่มควบคุม */
  .leaflet-top.leaflet-left {
    top: 80px !important; /* ขยับลงหลังโลโก้ */
  }
  .custom-controls {
    position: absolute;
    left: 10px;
    top: 170px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .custom-btn {
    background: white;
    border: 1px solid #ccc;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .custom-btn:hover {
    background: #f2f2f2;
  }

  /* เข็มทิศ */
  .compass {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 55px;
    height: 55px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    font-weight: bold;
    color: #d32f2f;
  }
  .compass::after {
    content: "N";
    position: absolute;
    top: 6px;
    font-size: 12px;
  }
  .compass-arrow {
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 15px solid #d32f2f;
    transform: rotate(0deg);
  }
