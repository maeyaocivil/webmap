<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMap - เทศบาลตำบลแม่ยาว</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- KML -->
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    html, body, #map { height: 100%; margin: 0; }

    /* ปรับธีมทางราชการ */
    body {
      font-family: "Sarabun", sans-serif;
      background: #f7f7f7;
    }

    /* ปุ่มควบคุมหลัก */
    .leaflet-control.custom-control {
      background: white;
      border: 1px solid #bbb;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin: 5px;
      padding: 4px 6px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }
    .leaflet-control.custom-control:hover {
      background: #f0f0f0;
    }

    /* กล่องชั้นข้อมูล */
    .layer-controls {
      padding: 8px;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
    }

    /* slider */
    .slider-group {
      margin-left: 10px;
      font-size: 12px;
      color: #444;
    }
    .slider-group input[type="range"] {
      width: 120px;
      accent-color: #0066cc;
    }

    /* เข็มทิศ */
    .compass {
      background: white;
      border-radius: 6px;
      border: 1px solid #bbb;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      padding: 4px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    /* มาตราส่วน */
    .scale-display {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="scale-display" id="scaleDisplay">มาตราส่วน 1:---</div>

  <script>
    // ตั้งค่าแผนที่
    const map = L.map('map', {
      center: [19.953, 99.769],
      zoom: 13
    });

    // แผนที่ฐาน
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Satellite'
    });

    const baseLayers = {
      "🗺️ OpenStreetMap": osm,
      "🛰️ Google Satellite": googleSat
    };

    const overlayLayers = {};
    const colors = {
      "หมู่ที่ 1": "#f94144", "หมู่ที่ 2": "#f3722c", "หมู่ที่ 3": "#f9c74f",
      "หมู่ที่ 4": "#90be6d", "หมู่ที่ 5": "#43aa8b", "หมู่ที่ 6": "#577590",
      "หมู่ที่ 7": "#277da1", "หมู่ที่ 8": "#4d908e", "หมู่ที่ 9": "#f9844a",
      "หมู่ที่ 10": "#ff6f61"
    };

    // โหลด layers.json
    fetch('layers/layers.json')
      .then(res => res.json())
      .then(files => {
        files.forEach(file => {
          const path = 'layers/' + file;
          const layer = omnivore.kml(path)
            .on('ready', function() {
              this.eachLayer(l => {
                const name = file.replace('.kml','');
                if (l.feature && l.feature.properties && l.feature.properties.name) {
                  const fname = l.feature.properties.name;
                  // สีหมู่บ้านตามชื่อ
                  for (const [k, c] of Object.entries(colors)) {
                    if (fname.includes(k)) {
                      l.setStyle({ color: c, fillColor: c, fillOpacity: 0.4 });
                    }
                  }
                  l.bindPopup(`<b>${fname}</b><br>${name}`);
                }
              });
            })
            .addTo(map);

          overlayLayers[file] = layer;
        });

        // สร้าง control ชั้นข้อมูล
        const layerControl = L.control.layers(baseLayers, overlayLayers, {collapsed:false}).addTo(map);

        // เพิ่ม slider ควบคุมแต่ละชั้น
        const container = layerControl.getContainer();
        const list = container.querySelector('.leaflet-control-layers-overlays');
        Object.keys(overlayLayers).forEach(file => {
          const label = Array.from(list.querySelectorAll('label')).find(l => l.textContent.includes(file));
          if (label) {
            const div = document.createElement('div');
            div.className = 'slider-group';
            div.innerHTML = `
              <div>ทึบ: <input type="range" min="0" max="1" step="0.1" value="0.8" data-type="opacity" data-file="${file}"></div>
              <div>หนา: <input type="range" min="1" max="10" step="1" value="2" data-type="weight" data-file="${file}"></div>
              <div>จุด: <input type="range" min="4" max="20" step="1" value="8" data-type="radius" data-file="${file}"></div>
            `;
            label.appendChild(div);
          }
        });

        // slider event
        container.addEventListener('input', e => {
          const type = e.target.dataset.type;
          const file = e.target.dataset.file;
          const val = parseFloat(e.target.value);
          const layer = overlayLayers[file];
          if (!layer) return;
          layer.eachLayer(l => {
            if (l.setStyle && (type === 'opacity' || type === 'weight')) {
              const st = {};
              if (type === 'opacity') st.fillOpacity = val, st.opacity = val;
              if (type === 'weight') st.weight = val;
              l.setStyle(st);
            }
            if (l.setRadius && type === 'radius') {
              l.setRadius(val);
            }
          });
        });
      });

    // ปุ่มตำแหน่งฉัน
    let userMarker;
    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function() {
      const div = L.DomUtil.create('div', 'leaflet-control custom-control');
      div.innerHTML = '<span class="material-symbols-outlined">my_location</span> ตำแหน่งฉัน';
      div.onclick = () => {
        if (userMarker) {
          map.removeLayer(userMarker);
          userMarker = null;
        } else {
          map.locate({setView:true, maxZoom:17});
        }
      };
      return div;
    };
    locateBtn.addTo(map);
    map.on('locationfound', e => {
      userMarker = L.marker(e.latlng).addTo(map).bindPopup("คุณอยู่ที่นี่").openPopup();
    });

    // ปุ่มรีเซ็ต
    const resetBtn = L.control({ position: 'topleft' });
    resetBtn.onAdd = function() {
      const div = L.DomUtil.create('div', 'leaflet-control custom-control');
      div.innerHTML = '<span class="material-symbols-outlined">refresh</span> รีเซ็ตตำบลแม่ยาว';
      div.onclick = () => map.setView([19.953, 99.769], 13);
      return div;
    };
    resetBtn.addTo(map);

    // เข็มทิศ
    const compass = L.control({ position: 'topright' });
    compass.onAdd = function() {
      const div = L.DomUtil.create('div', 'compass');
      div.innerHTML = '🧭 N';
      return div;
    };
    compass.addTo(map);

    // มาตราส่วน
    function updateScale() {
      const metersPerPixel = 40075016.686 * Math.abs(Math.cos(map.getCenter().lat * Math.PI / 180)) / Math.pow(2, map.getZoom() + 8);
      const scale = Math.round(metersPerPixel * 100); // 100px
      document.getElementById('scaleDisplay').innerText = `มาตราส่วน 1:${scale}`;
    }
    map.on('zoomend moveend', updateScale);
    updateScale();
  </script>
</body>
</html>
