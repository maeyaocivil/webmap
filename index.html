<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>OneMap - เทศบาลตำบลแม่ยาว</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; font-family: "Sarabun", sans-serif; background: #eef3f8; }
  #map { height: 100%; width: 100%; }

  /* ปุ่มหลัก */
  #toggleBtn {
    position: absolute; top: 15px; right: 15px;
    background: white; border: 1px solid #ccc;
    padding: 6px 12px; border-radius: 8px;
    z-index: 1001; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* กล่องชั้นข้อมูล */
  .layer-control {
    position: absolute; top: 60px; right: 15px;
    background: white; padding: 10px; max-height: 85vh;
    overflow-y: auto; border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    width: 280px; display: none; z-index: 1000;
  }
  .layer-item { margin-left: 10px; margin-bottom: 10px; }
  .slider-container { margin: 3px 0 5px 20px; font-size: 0.85em; color: #333; }
  .slider-container input[type="range"] { width: 85%; }

  .basemap-btn {
    display: inline-block; background: #f8f9fa;
    border: 1px solid #ccc; padding: 4px 8px; margin: 2px;
    border-radius: 5px; cursor: pointer;
  }
  .basemap-btn.active { background: #cce5ff; border-color: #007bff; }

  /* ปุ่มซ้าย */
  .map-btn {
    position: absolute; left: 15px;
    background: white; padding: 6px 10px;
    border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    border: 1px solid #ccc; cursor: pointer;
    z-index: 1001; font-size: 14px;
  }
  #resetBtn { top: 15px; }
  #locateBtn { top: 60px; }

  /* ปรับระยะปุ่ม + - */
  .leaflet-control-zoom { margin-top: 110px !important; }
</style>
</head>

<body>
<div id="map"></div>
<div id="toggleBtn">🧭 ชั้นข้อมูล</div>
<div id="resetBtn" class="map-btn">📍 รีเซ็ต ตำบลแม่ยาว</div>
<div id="locateBtn" class="map-btn">📡 ตำแหน่งฉัน</div>

<div class="layer-control" id="layerControl">
  <h3 style="margin-top:0;">🗺️ แผนที่ฐาน</h3>
  <div id="basemaps"></div>
  <hr>
  <h3>📚 ชั้นข้อมูล</h3>
  <div id="layerList"></div>
</div>

<script>
const map = L.map('map').setView([19.95, 99.80], 12);

// ฐานแผนที่
const baseLayers = {
  "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
  "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=th&x={x}&y={y}&z={z}', { maxZoom: 20 })
};
baseLayers["OpenStreetMap"].addTo(map);

// ปุ่มเปลี่ยนแผนที่ฐาน
const basemapsDiv = document.getElementById('basemaps');
Object.keys(baseLayers).forEach(key => {
  const btn = document.createElement('div');
  btn.textContent = key;
  btn.className = 'basemap-btn' + (key === "OpenStreetMap" ? ' active' : '');
  btn.onclick = () => {
    Object.values(baseLayers).forEach(l => map.removeLayer(l));
    baseLayers[key].addTo(map);
    document.querySelectorAll('.basemap-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  basemapsDiv.appendChild(btn);
});

// เปิด/ปิดกล่องชั้นข้อมูล
document.getElementById('toggleBtn').onclick = () => {
  const ctrl = document.getElementById('layerControl');
  ctrl.style.display = ctrl.style.display === 'none' ? 'block' : 'none';
};

// สีหมู่บ้านอิงชื่อ
function colorByVillage(name) {
  const colors = {
    "หมู่ที่ 1": "#ff6666", "หมู่ที่ 2": "#66b3ff", "หมู่ที่ 3": "#99ff99",
    "หมู่ที่ 4": "#ffcc66", "หมู่ที่ 5": "#cc99ff", "หมู่ที่ 6": "#ff99cc",
    "หมู่ที่ 7": "#99ffff", "หมู่ที่ 8": "#ff9966", "หมู่ที่ 9": "#cccccc"
  };
  for (let key in colors) if (name.includes(key)) return colors[key];
  return '#'+Math.floor(Math.random()*16777215).toString(16);
}

// โหลดไฟล์ KML ทั้งหมด
fetch('layers/layers.json')
.then(res => res.json())
.then(files => {
  const list = document.getElementById('layerList');
  files.forEach(fileName => {
    const name = fileName.replace('.kml', '');
    const div = document.createElement('div');
    div.className = 'layer-item';
    div.innerHTML = `<input type="checkbox" id="${name}"> <label for="${name}">${name}</label>`;
    list.appendChild(div);

    const layerGroup = L.layerGroup();
    let geoLayer;

    const addLayer = () => {
      geoLayer = omnivore.kml(`layers/${fileName}`)
      .on('ready', function() {
        const geojson = this.toGeoJSON();
        const typeSet = new Set(geojson.features.map(f => f.geometry.type));
        const color = fileName.includes("แนวเขตหมู่บ้าน") ? null : colorByVillage(name);

        this.eachLayer(f => {
          const type = f.feature.geometry.type;
          let style = {};
          if (type === "Point") {
            const c = color || colorByVillage(f.feature.properties.name || name);
            style = { radius: 7, fillColor: c, color: "#333", weight: 1, fillOpacity: 0.8 };
            const latlng = f.getLatLng();
            const marker = L.circleMarker(latlng, style).bindPopup(name);
            layerGroup.addLayer(marker);
          } else {
            const c = color || colorByVillage(f.feature.properties.name || name);
            style = { color: c, weight: 2, fillColor: c, fillOpacity: 0.5 };
            f.setStyle(style);
            f.bindPopup(name);
            layerGroup.addLayer(f);
          }
        });
        layerGroup.addTo(map);
      });
    };

    // toggle
    document.getElementById(name).addEventListener('change', e => {
      if (e.target.checked) addLayer();
      else map.removeLayer(layerGroup);
    });
  });
});

// 📍 ปุ่มรีเซ็ต
document.getElementById('resetBtn').onclick = () => map.setView([19.95, 99.80], 12);

// 📡 ตำแหน่งฉัน
let locateActive = false, locateMarker;
document.getElementById('locateBtn').onclick = () => {
  locateActive = !locateActive;
  if (locateActive) {
    map.locate({ setView: true, watch: true, maxZoom: 16 });
    map.on('locationfound', e => {
      if (locateMarker) locateMarker.setLatLng(e.latlng);
      else locateMarker = L.marker(e.latlng).addTo(map).bindPopup("ตำแหน่งของคุณ").openPopup();
    });
  } else {
    if (locateMarker) map.removeLayer(locateMarker);
    map.stopLocate();
  }
};
</script>
</body>
</html>
