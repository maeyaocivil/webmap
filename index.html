<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>WebMap Chiang Rai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />

  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
  <script src="https://unpkg.com/omnivore/leaflet-omnivore.min.js"></script>

  <script>
    // สร้างแผนที่เริ่มต้น
    const map = L.map('map').setView([19.9, 99.8], 11);

    // ฐานแผนที่
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: ['mt0','mt1','mt2','mt3'],
      attribution: '&copy; Google'
    });

    const baseMaps = {
      "แผนที่ถนน (OSM)": osm,
      "แผนที่ดาวเทียม (Google)": googleSat
    };

    const overlayMaps = {};

    // โหลดชั้นข้อมูลจาก layers.json
    fetch('layers.json')
      .then(res => res.json())
      .then(layers => {
        layers.forEach(layer => {
          // โหลดแต่ละไฟล์ KML พร้อมสี
          const kmlLayer = omnivore.kml(layer.url, null, L.geoJSON(null, {
            style: { color: layer.color }
          }));

          overlayMaps[layer.name] = kmlLayer;
        });
